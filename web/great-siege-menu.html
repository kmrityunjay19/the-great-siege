  <style>
    #siege-menu {position:fixed;inset:0;z-index:8;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,440px);background:#0c1115;color:#e7dfcf;font-family:Georgia,'Times New Roman',serif;overflow:auto}
    #siege-menu[hidden]{display:none}
    .siege-art{position:absolute;inset:0;background:radial-gradient(ellipse at 23% 69%,#9b4b1d55,transparent 38%),linear-gradient(110deg,#101a21 10%,#1b2529 50%,#0b1117 85%);overflow:hidden}
    .siege-art svg{position:absolute;width:100%;height:100%;inset:0;opacity:.8}
    .siege-art:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,#0c111588 48%,#0c1115ed 78%),linear-gradient(0deg,#0c1115 0%,transparent 40%)}
    .siege-brand{position:relative;align-self:start;margin:10vh 0 0 7vw;z-index:1}
    .siege-eyebrow{font:11px/1.5 ui-monospace,monospace;letter-spacing:.28em;color:#bc9c66;text-transform:uppercase}
    .siege-brand h1{font-weight:normal;font-size:clamp(42px,6vw,84px);line-height:.94;letter-spacing:-.04em;margin:24px 0;color:#eee5d1;text-shadow:0 4px 28px #0008}
    .siege-brand h1 span{display:block}
    .siege-rule{width:56px;height:2px;background:#bb8750;margin:26px 0}
    .siege-tagline{max-width:260px;font-size:16px;line-height:1.7;color:#b8b8b0}
    .siege-actions{position:relative;z-index:1;align-self:center;padding:70px 56px 70px 16px}
    .siege-actions h2{font:11px ui-monospace,monospace;letter-spacing:.22em;color:#8e9798;text-transform:uppercase;margin:0 0 24px}
    .siege-action{display:flex;align-items:center;justify-content:space-between;width:100%;padding:19px 20px;border:1px solid #69716d55;background:#19212688;color:#e7dfcf;text-align:left;font:19px Georgia,serif;cursor:pointer;margin:0 0 10px;transition:background .15s,border-color .15s,transform .15s}
    .siege-action:hover,.siege-action:focus-visible{background:#a67b3e22;border-color:#bc9c66;transform:translateX(3px);outline:none}
    .siege-action.primary{background:#bc9c66;color:#13181b;border-color:#bc9c66}
    .siege-action.primary:hover{background:#d3b783}
    .siege-action small{font:11px ui-monospace,monospace;color:inherit;opacity:.55}
    .siege-action:disabled{opacity:.4;cursor:wait;transform:none}
    #siege-ready{min-height:20px;font:11px/1.6 ui-monospace,monospace;color:#9b9e95;margin-top:22px}
    #aboutbtn{z-index:12} #fsbtn{z-index:12} #status,#bar{z-index:12}
    @media(max-width:800px){#siege-menu{grid-template-columns:1fr;align-content:center;padding:28px 0}.siege-brand{margin:20px 8vw 12px}.siege-brand h1{font-size:54px;margin:16px 0}.siege-tagline,.siege-rule{display:none}.siege-actions{padding:20px 8vw 50px}.siege-actions h2{margin-bottom:14px}.siege-action{padding:14px 18px;font-size:17px}.siege-art:after{background:#0c1115aa}}
  </style>
